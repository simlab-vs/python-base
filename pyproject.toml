[project]
name = "python-base"
version = "0.1.0"
description = "Base python project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.43.0",
    "simlab-tools[storage]",
]

# Set curent project as a package, with src/ folder.
[tool.uv]
package = true

[tool.uv.sources]
simlab-tools = { git = "https://github.com/simlab-vs/simlab-tools.git" }

# Longer than standard 79 char max line length.
[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = [
  "E501", # enforce the line-too-long rule
  "UP",  # pyupgrade
  "D",   # pydocstyle
]

# Docstring style numpy (instead of Google).
[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Dev dependencies. Linters (ruff, ty, pre-commit) are run through uvx and are
# deliberately absent here; pytest must import the project, so it lives in the env.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
